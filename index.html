<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能简历筛选助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 p-6">
            <h1 class="text-2xl font-bold text-white">🚀 AI 智能简历筛选系统</h1>
            <p class="text-blue-100 mt-2">基于阿里云 Serverless + 通义千问大模型</p>
        </div>

        <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Left: Inputs -->
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">1. 上传简历 (PDF)</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="resume-file" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg class="w-8 h-8 mb-4 text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                                </svg>
                                <p class="text-sm text-gray-500"><span class="font-semibold">点击上传</span> 或拖拽文件</p>
                                <p class="text-xs text-gray-500" id="file-name">支持 PDF 格式</p>
                            </div>
                            <input id="resume-file" type="file" class="hidden" accept=".pdf" />
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">2. 岗位描述 (JD)</label>
                    <textarea id="jd-text" rows="6" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入招聘要求，例如：需要3年Python经验，熟悉阿里云..."></textarea>
                </div>

                <button onclick="analyzeResume()" id="submit-btn" class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-3 text-center flex justify-center items-center">
                    开始智能分析
                </button>
            </div>

            <!-- Right: Results -->
            <div class="bg-gray-50 rounded-lg p-6 border border-gray-200">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">分析结果</h2>
                
                <div id="loading" class="hidden flex flex-col items-center justify-center h-64">
                    <div class="loader mb-4"></div>
                    <p class="text-gray-500 animate-pulse">AI 正在阅读简历并打分...</p>
                </div>

                <div id="result-content" class="hidden space-y-4">
                    <!-- Score Card -->
                    <div class="flex items-center justify-between bg-white p-4 rounded-lg shadow-sm">
                        <span class="text-gray-600">匹配得分</span>
                        <span id="score-display" class="text-3xl font-bold text-blue-600">--</span>
                    </div>

                    <!-- Tags -->
                    <div id="tags-container" class="flex flex-wrap gap-2"></div>

                    <!-- Info List -->
                    <div class="bg-white p-4 rounded-lg shadow-sm text-sm space-y-2">
                        <p><strong>姓名:</strong> <span id="res-name">-</span></p>
                        <p><strong>学历:</strong> <span id="res-edu">-</span></p>
                        <p><strong>经验:</strong> <span id="res-exp">-</span></p>
                        <p><strong>电话:</strong> <span id="res-phone">-</span></p>
                    </div>

                    <!-- Analysis -->
                    <div class="bg-blue-50 p-4 rounded-lg text-sm text-blue-800">
                        <p class="font-bold mb-1">AI 评价:</p>
                        <p id="res-reason">...</p>
                    </div>
                </div>
                
                <div id="empty-state" class="flex items-center justify-center h-64 text-gray-400 text-sm">
                    请在左侧上传文件并输入JD
                </div>
            </div>
        </div>
    </div>

    <script>
        // 配置你的阿里云函数计算地址
        const API_URL = 'https://web-jpfaxhhiut.cn-shanghai.fcapp.run/analyze'; 

        const fileInput = document.getElementById('resume-file');
        const fileNameDisplay = document.getElementById('file-name');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                fileNameDisplay.textContent = e.target.files[0].name;
            }
        });

        async function analyzeResume() {
            const file = fileInput.files[0];
            const jd = document.getElementById('jd-text').value;

            if (!file || !jd) {
                alert('请确保上传了简历并填写了岗位描述');
                return;
            }

            // UI State Loading
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').innerText = '分析中...';
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('result-content').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            const formData = new FormData();
            formData.append('resume', file);
            formData.append('jd', jd);

            try {
                const response = await axios.post(API_URL, formData, {
                    headers: { 'Content-Type': 'multipart/form-data' }
                });

                renderResult(response.data);
            } catch (error) {
                console.error(error);
                alert('分析失败: ' + (error.response?.data?.error || error.message));
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('submit-btn').innerText = '开始智能分析';
            }
        }

        function renderResult(data) {
            document.getElementById('result-content').classList.remove('hidden');
            
            // Basic Info
            document.getElementById('res-name').textContent = data.basic_info.name;
            document.getElementById('res-phone').textContent = data.basic_info.phone;
            document.getElementById('res-edu').textContent = data.other_info.education;
            document.getElementById('res-exp').textContent = data.other_info.years_of_experience;

            // Score & Reason
            const score = data.matching_analysis.score;
            const scoreEl = document.getElementById('score-display');
            scoreEl.textContent = score;
            scoreEl.className = `text-3xl font-bold ${score >= 80 ? 'text-green-600' : score >= 60 ? 'text-yellow-600' : 'text-red-600'}`;
            
            document.getElementById('res-reason').textContent = data.matching_analysis.reason;

            // Keywords
            const tagsContainer = document.getElementById('tags-container');
            tagsContainer.innerHTML = '';
            
            // Render Matching Keywords
            data.matching_analysis.matching_keywords.forEach(kw => {
                const span = document.createElement('span');
                span.className = 'px-2 py-1 bg-green-100 text-green-800 text-xs rounded-full';
                span.textContent = `✅ ${kw}`;
                tagsContainer.appendChild(span);
            });

            // Render Missing Keywords
            data.matching_analysis.missing_keywords.forEach(kw => {
                const span = document.createElement('span');
                span.className = 'px-2 py-1 bg-red-100 text-red-800 text-xs rounded-full';
                span.textContent = `❌ ${kw}`;
                tagsContainer.appendChild(span);
            });
        }
    </script>
</body>
</html>
